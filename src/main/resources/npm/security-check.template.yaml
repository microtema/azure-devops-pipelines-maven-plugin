- stage: security_check
  displayName: Security Check
  dependsOn: [ compile ]
  condition: succeeded('compile')
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: security
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm ci
          displayName: 'npm ci'