- stage: app_deployment
  displayName: App Deployment
  dependsOn: [ infra_deployment ]
  condition: and( succeeded('infra_deployment'), or(eq(variables.isDevelop, true), eq(variables.isRelease, true), eq(variables.isMaster, true)))
  variables:
    SUBSCRIPTION_NAME: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
    RESOURCE_GROUP_NAME: ${{ lower(variables['REPO_PROJECT']) }}-${{ lower(variables['APP_NAME']) }}-${{ lower(variables['ENV_NAME']) }}-${{ lower(variables['LOCATION_SHORT']) }}-${{ lower(variables['COUNTER']) }}
  jobs:
    - job: app_deployment
      displayName: Azure Func Core Tools
      steps:
        - task: FuncToolsInstaller@0
          inputs:
            version: "4.0.5907"
          displayName: Install Azure Func Core Tools
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'
        - script: npm run build
          displayName: 'npm run build'
        - task: AzureCLI@2
          displayName: Run Azure Func Core Tools
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: func azure functionapp publish $RESOURCE_GROUP_NAME
