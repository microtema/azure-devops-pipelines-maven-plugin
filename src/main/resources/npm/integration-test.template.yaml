- stage: integration_test
  displayName: Integration Test
  dependsOn: [ security_check ]
  condition: succeeded('security_check')
  variables:
    - group: DEV
  jobs:
    - job: test
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm run e2e
          displayName: 'npm run e2e'
