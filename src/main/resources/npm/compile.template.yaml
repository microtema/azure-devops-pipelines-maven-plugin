- stage: compile
  displayName: Compile
  dependsOn: [ versioning ]
  condition: succeeded('versioning')
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: compile
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'