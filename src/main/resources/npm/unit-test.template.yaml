- stage: unit_test
  displayName: Unit Test
  dependsOn: [ security_check ]
  condition: succeeded('security_check')
  variables:
    - group: DEV
  jobs:
    - job: test
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm test
          displayName: 'npm test'
