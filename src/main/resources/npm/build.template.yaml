- stage: build
  displayName: Build
  dependsOn: [ %DEPENDS_ON% ]
  condition: and( always(), %CONDITIONS% )
  variables:
    - group: DEV
  jobs:
    - job: build
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'
        - script: npm run build
          displayName: 'npm run build'