- stage: smoke_test
  displayName: Smoke Test
  dependsOn: [ system_test ]
  condition: and(succeeded('readiness'), not(failed('system_test')), eq(variables.isMaster, true))
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: test
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'
        - download: current
          artifact: shared-files
        - script: mv $(Pipeline.Workspace)/shared-files/.env .
          displayName: replace .env file
        - script: npm run smoke:test
          displayName: 'npm run smoke:test'