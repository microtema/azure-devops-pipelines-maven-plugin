- stage: system_test
  displayName: System Test
  dependsOn: [ readiness ]
  condition: and(succeeded('readiness'), or(eq(variables.isDevelop, true), eq(variables.isRelease, true)))
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: test
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'
        - download: current
          artifact: shared-files
        - script: mv $(Pipeline.Workspace)/shared-files/.env .
          displayName: replace .env file
        - script: npm run system:test
          displayName: 'npm run system:test'