- stage: system_test
  displayName: System Test
  dependsOn: [ readiness ]
  condition: and(succeeded('readiness'), or(eq(variables.isDevelop, true), eq(variables.isRelease, true), eq(variables.isMaster, true)))
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: test
      steps:
        - task: UseNode@1
          inputs:
            version: '$(NODE_VERSION)'
          displayName: 'Install Node.js'
        - script: npm install
          displayName: 'npm install'
        - script: npm run system:test
          env:
            SERVER_URL: "https://${{ lower(variables['REPO_PROJECT']) }}-${{ lower(variables['APP_NAME']) }}-${{ lower(variables['ENV_NAME']) }}-${{ lower(variables['LOCATION_SHORT']) }}-${{ lower(variables['COUNTER']) }}.azurewebsites.net"
          displayName: 'npm run system:test'