- stage: infra_precondition
  displayName: Infra Precondition
  dependsOn: [ infra_security_check ]
  condition: and( succeeded('infra_security_check'), or(eq(variables.isDevelop, true), eq(variables.isRelease, true), eq(variables.isMaster, true)))
  variables:
    RESOURCE_GROUP_NAME: ${{ lower(variables['REPO_PROJECT']) }}-${{ lower(variables['ENV_NAME']) }}-${{ lower(variables['LOCATION_SHORT']) }}-${{ lower(variables['COUNTER']) }}
  jobs:
    - job: check
      displayName: Check Storage Container Group
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Check Resource Group
          name: step1
          inputs:
            azureSubscription: $(SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: echo "##vso[task.setvariable variable=check;isoutput=true]$(az storage container exists --name $APP_NAME --account-name ${RESOURCE_GROUP_NAME//-/} 2>/dev/null | jq -r '.exists')"
    - job: storage_container
      displayName: Create Storage Container
      dependsOn: [ check ]
      condition: eq(dependencies.check.outputs['step1.check'], 'false')
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Create Storage Container
          inputs:
            azureSubscription: $(SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az storage container create \
                --name $APP_NAME \
                --account-name ${RESOURCE_GROUP_NAME//-/} \
                --resource-group RESOURCE_GROUP_NAME \
                --public-access blob