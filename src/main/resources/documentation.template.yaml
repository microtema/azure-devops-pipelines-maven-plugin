- stage: documentation
  displayName: Documentation
  dependsOn: [ tag ]
  condition: and(succeeded('system_test'), not(failed('tag')), or(eq(variables.isDevelop, true), eq(variables.isRelease, true), eq(variables.isMaster, true)))
  variables:
    - group: ${{ variables.ENV_NAME }}
  jobs:
    - job: documentation
      steps:
        - checkout: self
        - script: |
            git clone https://$(repoToken)@dev.azure.com/$(REPO_ORGANISATION)/$(REPO_PROJECT)/_git/$(DOC_REPO)
            cd $(DOC_REPO) 
            git checkout $(BRANCH_NAME)
          displayName: 'Git: checkout'
        - script: |
            git branch
            mkdir -p $(DOC_REPO)/.docs/$(APP_NAME)/deleteme
            rm -r $(DOC_REPO)/.docs/$(APP_NAME)/*
            cp -R .docs/. $(DOC_REPO)/.docs/$(APP_NAME)
          displayName: 'Copy Documentation'
        - script: |
            cd $(DOC_REPO)
            git add --all
            git status
            if [[ `git status --porcelain` ]]; then
               git config --global user.email $(CONTACT_EMAIL)
               git config --global user.name $(CONTACT_NAME)
               git commit -am "Update DOC_AS_CODE repo within docs from $(REPO_NAME) commit $(GIT_COMMIT)"
               git push https://$(repoToken)@dev.azure.com/$(REPO_ORGANISATION)/$(REPO_PROJECT)/_git/$(DOC_REPO)
            fi
          displayName: 'Git: Commit'
