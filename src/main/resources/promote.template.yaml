- stage: infra_precondition
  displayName: Infra Precondition
  dependsOn: [ build ]
  condition: and( succeeded('build'), or(eq(variables.isDevelop, true), eq(variables.isRelease, true), eq(variables.isMaster, true)))
  variables:
    RESOURCE_GROUP_NAME: ${{ lower(variables['REPO_PROJECT']) }}-${{ lower(variables['APP_NAME']) }}-${{ lower(variables['ENV_NAME']) }}-${{ lower(variables['LOCATION_SHORT']) }}-${{ lower(variables['COUNTER']) }}
  jobs:
    - job: check
      displayName: Check Resource Group
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Check Resource Group
          name: step1
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: echo "##vso[task.setvariable variable=check;isoutput=true]$(az group exists --name $RESOURCE_GROUP_NAME)"
    - job: resource_group
      displayName: Create Resource Group
      dependsOn: [ check ]
      condition: eq(dependencies.check.outputs['step1.check'], 'false')
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Create Resource Group
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: az group create --name $RESOURCE_GROUP_NAME --location $LOCATION
        - task: AzureCLI@2
          displayName: Wait for Resource Group
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: az group wait --created --resource-group $RESOURCE_GROUP_NAME
    - job: storage_account
      displayName: Create Storage Account
      dependsOn: [ check, resource_group ]
      condition: eq(dependencies.check.outputs['step1.check'], 'false')
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Create Storage Account
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az storage account create \
                --name ${RESOURCE_GROUP_NAME//-/} \
                --resource-group $RESOURCE_GROUP_NAME \
                --allow-blob-public-access true \
                --min-tls-version TLS1_2 \
                --tags Project=$REPO_PROJECT Service=$APP_NAME Cost-Center=$COST_CENTER Environment=$ENV_NAME
    - job: storage_container
      displayName: Create Storage Container
      dependsOn: [ check, storage_account ]
      condition: eq(dependencies.check.outputs['step1.check'], 'false')
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: Create Storage Container
          inputs:
            azureSubscription: $(REPO_PROJECT)_SUBSCRIPTION_$(ENV_NAME)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az storage container create \
                --name tfstate \
                --account-name ${RESOURCE_GROUP_NAME//-/} \
                --resource-group $RESOURCE_GROUP_NAME \
                --public-access blob